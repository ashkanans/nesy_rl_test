[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
(
  trajectory-transformer
  | suffix-prediction
  | nesy-suffix-prediction-dfa
  | implicit_q_learning
  | paper
  | runs
  | simpleDFAs
  | symbolicDFAs
)
'''

[tool.isort]
profile = "black"
line_length = 100
py_version = 310
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  "trajectory-transformer",
  "suffix-prediction",
  "nesy-suffix-prediction-dfa",
  "implicit_q_learning",
  "paper",
  "runs",
  "simpleDFAs",
  "symbolicDFAs",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
  "E402",  # imports after sys.path manipulation in legacy modules
  "E501",  # line length handled by Black baseline
  "F401",  # keep legacy imports during baseline setup
  "F841",  # keep legacy local variables during baseline setup
]
